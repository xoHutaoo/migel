name: Build CharlieChaos EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Install AutoHotkey v2
        shell: powershell
        run: |
          choco install autohotkey -y

      - name: Download Ahk2Exe
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://github.com/AutoHotkey/Ahk2Exe/archive/refs/heads/master.zip" `
            -OutFile "$env:TEMP\Ahk2Exe.zip"

          Expand-Archive `
            "$env:TEMP\Ahk2Exe.zip" `
            "$env:TEMP\Ahk2Exe" `
            -Force

      - name: Find compiler
        shell: powershell
        run: |
          $compiler = Get-ChildItem `
            "$env:TEMP\Ahk2Exe" `
            -Recurse `
            -Filter "Ahk2Exe.exe" |
            Select-Object -First 1

          if (!$compiler) {
            Write-Host "Files found:"
            Get-ChildItem "$env:TEMP\Ahk2Exe" -Recurse
            throw "Ahk2Exe.exe not found"
          }

          $base = Get-ChildItem `
            "C:\Program Files\AutoHotkey" `
            -Recurse `
            -Filter "AutoHotkey64.exe" |
            Select-Object -First 1

          if (!$base) {
            throw "AutoHotkey64.exe not found"
          }

          echo "AHK_COMPILER=$($compiler.FullName)" >> $env:GITHUB_ENV
          echo "AHK_BASE=$($base.FullName)" >> $env:GITHUB_ENV

      - name: Compile
        shell: powershell
        run: |
          & "$env:AHK_COMPILER" `
            /in "$env:GITHUB_WORKSPACE\CharlieChaos.ahk" `
            /out "$env:GITHUB_WORKSPACE\CharlieChaos.exe" `
            /icon "$env:GITHUB_WORKSPACE\CharlieKirk.ico" `
            /base "$env:AHK_BASE"

          if (!(Test-Path "$env:GITHUB_WORKSPACE\CharlieChaos.exe")) {
            throw "CharlieChaos.exe was not created"
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: CharlieChaos
          path: CharlieChaos.exe
